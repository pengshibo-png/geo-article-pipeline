name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: S3 spec gate (variables / review contract / brand sections)
        run: |
          python spec/prompts/_共享/check_variables.py
          python spec/prompts/_样例/validate_review.py spec/prompts/_样例/B-审稿输出-样例.json
          python spec/品牌资料规范/check_brand.py
      - name: Tests (fake provider, offline)
        shell: bash
        env:
          GEO_ENV: test
        run: |
          set -o pipefail
          python -m pytest tests -q -ra --tb=short -p no:cacheprovider 2>&1 | tee pytest-out.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: |
          set +e
          fails=$(grep -E '^(FAILED|ERROR)' pytest-out.log | head -6)
          [ -z "$fails" ] && fails=$(tail -c 700 pytest-out.log | tr '\n' ' ')
          printf '::error title=pytest failed::%s\n' "${fails//$'\n'/%0A}"
