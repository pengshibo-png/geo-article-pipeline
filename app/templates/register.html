<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · GEO优化系统</title>
<style>
  /* 独立公开页: 不加载后台 layout.js(它在 401 时会把匿名访客弹去登录页),
     也不带侧边栏, 首页顶部只放品牌与登录入口。 */
  :root { --brand:#9a7b3f; --ink:#1a1a1a; --ink2:#4a5058; --ink3:#8a9099;
          --line:#e6e8eb; --bg:#f6f7f9; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  .top { height:58px; background:var(--card); border-bottom:1px solid var(--line);
         display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
  .top .b { font-size:15px; font-weight:600; letter-spacing:.3px; }
  .top .b i { color:var(--brand); font-style:normal; margin-right:8px; }
  .top a { font-size:13px; color:var(--ink2); text-decoration:none;
           border:1px solid var(--line); padding:6px 14px; border-radius:6px; }
  .top a:hover { color:var(--brand); border-color:var(--brand); }
  .wrap { max-width:820px; margin:0 auto; padding:52px 24px 40px; }
  .h1 { font-size:26px; font-weight:600; margin:0 0 10px; }
  .sub { color:var(--ink3); font-size:13px; line-height:1.9; margin-bottom:28px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:30px; }
  .c { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; }
  .c b { display:block; font-size:13px; margin-bottom:6px; }
  .c span { font-size:12px; color:var(--ink3); line-height:1.7; }
  .go { background:var(--brand); color:#fff; border:none; border-radius:7px;
        padding:12px 30px; font-size:14px; cursor:pointer; font-family:inherit; }
  .go:hover { opacity:.92; }
  .foot { margin-top:18px; font-size:12px; color:var(--ink3); line-height:1.9; }
  @media (max-width:720px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top">
  <span class="b"><i>◆</i>GEO优化系统</span>
  <a href="/login">已有账号，去登录</a>
</div>

<div class="wrap">
  <h1 class="h1">注册新企业</h1>
  <div class="sub">
    填一次表，系统自动为你建好：<b>独立数据空间、客户登录账号、品牌资料档案、投放城市池、标题库、以及抖音图文的生成与发布配置</b>。<br>
    提交后即可用「企业标识 + 你设置的密码」登录后台，开始生成内容。
  </div>

  <div class="cards">
    <div class="c"><b>数据完全隔离</b><span>每家企业的文章、图片、标题、发布记录各自独立，互不可见。</span></div>
    <div class="c"><b>内容自动生成</b><span>填好品牌资料后，系统按你的业务线与投放城市自动产出文章与抖音图文。</span></div>
    <div class="c"><b>可随时补充</b><span>品牌资料越具体，生成的内容越可信；后续可随时在后台补填。</span></div>
  </div>

  <button class="go" id="btn-go">开始注册</button>
  <div class="foot">
    提交即表示你已获得所填企业的授权。<br>
    如需人工协助，请联系管理员为你开通。
  </div>
</div>

<script src="/static/register.js?v={{ asset_ver }}"></script>
<script>
  document.getElementById('btn-go').addEventListener('click', () => REG.open());
  // 公开页不带后台布局, 这里直接展开向导
  window.addEventListener('load', () => REG.open());
</script>
</body>
</html>
