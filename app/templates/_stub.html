<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page }} · GEO 优化系统</title>
<style>
:root{--bg:#F6F7FB;--card:#fff;--line:#E7EAF3;--ink:#0C1226;--ink2:#46506B;--brand:#4F46E5;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px 36px;
      max-width:520px;width:100%;box-shadow:0 1px 2px rgba(16,24,64,.05)}
.h1{font-size:20px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:var(--ink2);line-height:1.8}
.tag{display:inline-block;font-size:12px;color:var(--brand);border:1px solid var(--line);
     border-radius:999px;padding:2px 10px;margin-top:14px}
code{background:#EFF1F8;color:#4338CA;padding:1px 6px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
  <div class="card">
    <div class="h1">{{ page }}</div>
    <div class="sub">
      该页面属于 <code>{{ blueprint }}</code> 蓝图，路由 <code>{{ route }}</code>。<br>
      Phase 0 阶段使用统一占位模板；22 个冻结模板将在后续 Phase 按
      <code>ds.css</code> token 还原。
    </div>
    <div class="tag">Phase 0 · 骨架</div>
  </div>
</body>
</html>
